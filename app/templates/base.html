<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}LinkShort{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/linkshort-favicon.png" />
    <link rel="apple-touch-icon" href="/static/images/linkshort-favicon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    {% if current_user %}
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/dashboard" aria-label="LinkShort — Dashboard"><img class="brand-logo" src="/static/images/linkshort-logo.png" alt="LinkShort" /></a>
            <nav><a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' else '' }}">Dashboard</a><a href="/links" class="{{ 'active' if request.url.path.startswith('/links') else '' }}">Links</a></nav>
            <div class="sidebar-footer"><div class="avatar">{{ current_user.name[:1].upper() }}</div><div class="user-meta"><strong>{{ current_user.name }}</strong><span>{{ current_user.email }}</span></div><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}" /><button class="logout-btn" type="submit" title="Sair">↗</button></form></div>
        </aside>
        <main class="content">
    {% else %}
        <div class="page">
    {% endif %}
        {% block content %}{% endblock %}
    {% if current_user %}
        </main>
    </div>
    {% else %}
        </div>
    {% endif %}
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
